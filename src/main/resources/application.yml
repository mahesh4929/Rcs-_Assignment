
spring:
  application:
    name: rcs-mahesh

  datasource:
    url: jdbc:postgresql://localhost:5432/rcs
    username: postgres
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true

  sql:
    init:
      mode: always

server:
  port: 8080
